name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Make Gradle wrapper executable
        working-directory: New folder
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: New folder
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK exists
        run: |
          test -f "New folder/app/build/outputs/apk/debug/app-debug.apk"
          ls -lh "New folder/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: New folder/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
